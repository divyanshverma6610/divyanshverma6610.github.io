<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divyansh Verma</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  overflow: hidden;
  background: linear-gradient(-45deg, #0d0d0d, #1a1a1a, #262626, #0d0d0d);
background-size: 400% 400%;
animation: gradientMove 15s ease infinite;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.card {
  width: 90%;
  max-width: 380px;
  padding: 40px 25px;
  border-radius: 25px;
  text-align: center;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  animation: float 4s ease-in-out infinite;
  position: relative;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 25px;
  padding: 1px;
  background: linear-gradient(45deg, #ff416c, #ff4b2b, #00dbde);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}

.profile-img {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 20px;
  border: 3px solid white;
  box-shadow: 0 0 25px rgba(255,255,255,0.5);
  filter: contrast(110%) brightness(105%);
}

h1 {
  font-size: 1.9rem;
  margin-bottom: 25px;
}

.link-btn {
  position: relative;
  display: inline-block;
  padding: 14px 20px;
  border-radius: 30px;
  background: linear-gradient(45deg, #ff416c, #ff4b2b);
  color: white;
  text-decoration: none;
  font-weight: 500;
  overflow: hidden;
  transition: 0.3s;
}

.link-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}

.link-btn::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
  transition: 0.6s;
}

.link-btn:hover::after {
  left: 100%;
}

.link-btn:active::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background: rgba(255,255,255,0.3);
  top: -50%;
  left: -50%;
  border-radius: 50%;
  animation: ripple 0.6s linear;
}

@keyframes ripple {
  from { transform: scale(0); opacity: 1; }
  to { transform: scale(1); opacity: 0; }
}

.footer {
  margin-top: 25px;
  font-size: 0.75rem;
  opacity: 0.6;
}
</style>
</head>
<body>

<div class="card">
  <img src="profile.jpg" class="profile-img">
  <h1>Divyansh Verma</h1>

  <a href="https://www.instagram.com/_._._divyansh/" target="_blank" class="link-btn">
    📷 Follow me on Instagram
  </a>

  <div class="footer">© 2026 Divyansh</div>
</div>

</body>
</html>
